name: 이미지 만들고 배포 태그 갱신

# ★「main 병합 = 자동 배포」의 마지막 조각입니다.
#
#   main 에 병합  →  ★이 워크플로가 이미지를 만들어 Container Registry 에 올리고
#                 →  catchap-infra 의 매니페스트에서 ★이미지 태그를 그 커밋 해시로 고칩니다
#                 →  ArgoCD 가 그걸 보고 클러스터에 반영합니다
#
# ★태그는 반드시 ★커밋 해시입니다. latest 를 쓰면 무엇이 떠 있는지 알 수 없어집니다.
#
# ⚠️★이 저장소만 다른 점 — 이미지가 ★약 9.5GB 입니다
#    (CUDA 12.2 + cuDNN8 베이스 약 6.6GB + ★이미지에 구운 모델 3.09GB)
#     ① ★캐시는 GitHub 것이 아니라 ★우리 레지스트리를 씁니다 (0811 변경).
#        GitHub Actions 캐시는 저장소당 ★10GB 한도라 이 이미지 하나로 꽉 차고
#        ★다른 저장소의 캐시까지 밀어냅니다. 그래서 그건 안 씁니다.
#
#        ⚠️★캐시를 아예 안 쓰던 것이 더 나빴습니다 (0810 실측).
#          매번 모델을 HuggingFace 에서 새로 받는데, 그때 파일 시각이 달라져
#          도커가 ★다른 층으로 봅니다. 그래서 배포할 때마다 레지스트리에
#          ★2.65GB 가 새로 쌓였습니다. 태그 4개 중 2개가 같은 모델을 따로 갖고
#          있는 것을 층 digest 로 확인했습니다.
#
#        ★레지스트리 캐시는 용량을 ★덜 씁니다. 안 바뀐 층을 그대로 재사용해
#          새 층이 안 생기고, 캐시 자체는 ★같은 태그를 덮어써서 한 벌만 남습니다.
#     ② ★러너 디스크를 먼저 비웁니다. 기본 상태로는 빠듯합니다.
#     ③ timeout 이 30분이 아니라 ★90분입니다.
#        ⚠️45분으로 뒀다가 ★실제로 걸려서 취소됐습니다(0810).
#          모델을 이미지에 구우면서 6.6GB → 9.5GB 가 됐고, 굽고 올리는 데
#          45분을 넘겼습니다. 넉넉히 두 배로 올렸습니다.
#
# ⬜필요한 Secret 3개 (저장소 Settings → Secrets and variables → Actions)
#     REGISTRY_USERNAME        Container Registry 용 ★IAM 액세스 키 ID
#     REGISTRY_PASSWORD        〃 보안 액세스 키
#     INFRA_DEPLOY_KEY   catchap-infra 에 ★쓰기 권한이 있는 Deploy key 의 ★비밀키
#                        (ArgoCD 가 쓰는 읽기 전용 키와 ★다른 키입니다)

on:
  push:
    branches: [main]
  workflow_dispatch:      # 손으로도 돌릴 수 있게

permissions:
  contents: read

concurrency:
  # 같은 저장소에서 연달아 병합되면 ★뒤엣것만 남깁니다 (태그가 엎치락뒤치락하지 않게)
  group: deploy-stt-worker
  cancel-in-progress: false

env:
  REGISTRY: kc-sfacspace05.kr-central-2.kcr.dev
  IMAGE_PATH: catchap-ai-repo/catchap-stt-worker
  MANIFEST: k8s/stt-worker/30-deployment.yaml

jobs:
  build-and-update:
    name: 이미지 → 레지스트리 → 매니페스트 태그
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 코드 받기
        uses: actions/checkout@v5

      - name: 태그 정하기 (커밋 해시 7자리)
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 필요한 Secret 이 다 있나 먼저 본다
        id: gate
        env:
          U: ${{ secrets.REGISTRY_USERNAME }}
          P: ${{ secrets.REGISTRY_PASSWORD }}
          K: ${{ secrets.INFRA_DEPLOY_KEY }}
        run: |
          # ★값은 찍지 않고 있는지만 봅니다
          MISS=""
          [ -z "$U" ] && MISS="$MISS REGISTRY_USERNAME"
          [ -z "$P" ] && MISS="$MISS REGISTRY_PASSWORD"
          [ -z "$K" ] && MISS="$MISS INFRA_DEPLOY_KEY"
          if [ -n "$MISS" ]; then
            # ★실패가 아니라 ★건너뜁니다 — 아직 Secret 을 안 넣은 동안 main 이 빨개지지 않게.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret 이 아직 없습니다 →$MISS · 이미지 빌드를 건너뜁니다."
            {
              echo "### ⬜아직 준비 중입니다"
              echo ""
              echo '```'
              echo "$MISS"
              echo '```'
              echo ""
              echo "저장소 Settings → Secrets and variables → Actions"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Secret 3개 확인"

      - name: 러너 디스크 비우기 (이미지가 약 9.5GB 입니다)
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "── 비우기 전"; df -h / | tail -1
          # ★우리가 안 쓰는 선탑재 도구들입니다. 지우면 20GB 안팎이 납니다.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "── 비운 뒤";   df -h / | tail -1

      - name: Buildx 준비
        if: steps.gate.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 레지스트리 로그인
        if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 이미지 만들고 올리기
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:${{ steps.tag.outputs.sha }}
          # ★latest 는 일부러 안 붙입니다 — 무엇이 떠 있는지 알 수 없어집니다
          #
          # ★캐시 — 우리 레지스트리에 buildcache 태그로 둡니다.
          #   코드만 고칠 때 모델 층(2.65GB)을 다시 받지 않고 그대로 씁니다.
          #
          # ⚠️★ignore-error 를 켠 이유 — 카카오 레지스트리가 buildkit 의 캐시
          #   형식을 받아 주는지 ★확인된 바가 없습니다. 안 받아 주면 캐시 내보내기가
          #   실패하는데, 그때 ★배포까지 같이 죽으면 안 됩니다. 캐시는 빨라지자고
          #   붙이는 것이지 없으면 안 되는 것이 아닙니다.
          #
          # ⚠️mode=max 가 아니라 ★mode=min 입니다. max 는 중간 층까지 전부 저장해
          #   레지스트리를 더 먹습니다. 우리 Dockerfile 은 단일 단계라 min 으로도
          #   모델 층이 캐시됩니다.
          #
          # ⚠️image-manifest·oci-mediatypes 를 켠 이유 — 기본 캐시 매니페스트는
          #   비표준 형식이라 거부하는 레지스트리가 있습니다. 표준 형식으로 보냅니다.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:buildcache,mode=min,image-manifest=true,oci-mediatypes=true,ignore-error=true
          provenance: false

      - name: catchap-infra 받기 (쓰기 키로)
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.INFRA_DEPLOY_KEY }}" > ~/.ssh/infra
          chmod 600 ~/.ssh/infra
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/infra -o IdentitiesOnly=yes" \
            git clone --quiet git@github.com:catchap-captcha/catchap-infra.git infra
          test -d infra/.git || { echo "::error::catchap-infra 를 못 받았습니다"; exit 1; }

      - name: 매니페스트 태그 갱신
        if: steps.gate.outputs.ready == 'true'
        id: bump
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          cd infra
          F="$MANIFEST"
          test -f "$F" || { echo "::error::$F 가 없습니다"; exit 1; }
          BEFORE=$(grep -oE 'image: [^ ]+' "$F" | head -1)
          # ★이 저장소의 이미지 줄만 바꿉니다
          python3 - "$F" "$REGISTRY/$IMAGE_PATH" "$SHA" <<'PY'
          import io,re,sys
          f,path,sha = sys.argv[1], sys.argv[2], sys.argv[3]
          s = io.open(f, encoding='utf-8').read()
          s2, n = re.subn(r'(image:\s*)'+re.escape(path)+r':[^\s]+', r'\g<1>'+path+':'+sha, s)
          if n != 1:
              print("::error::이미지 줄을 %d 개 찾았습니다 (1개여야 합니다)" % n); sys.exit(1)
          io.open(f, 'w', encoding='utf-8', newline='\n').write(s2)
          PY
          AFTER=$(grep -oE 'image: [^ ]+' "$F" | head -1)
          echo "  전: $BEFORE"
          echo "  후: $AFTER"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::태그가 이미 같습니다 — 커밋하지 않습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: catchap-infra 에 올리기
        if: steps.gate.outputs.ready == 'true' && steps.bump.outputs.changed == 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          cd infra
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MANIFEST"
          git commit -q -m "ci(deploy): stt-worker 이미지를 ${SHA} 로" \
                        -m "${GITHUB_REPOSITORY}@${GITHUB_SHA} 가 main 에 들어와 만든 이미지다. ArgoCD 가 이 커밋을 보고 반영한다."
          # ★다른 저장소가 같은 때 병합되면 이 push 가 거절된다(non-fast-forward).
          #   ★우리는 이미지 줄 한 줄만 고치므로 다시 얹으면 그대로 맞는다.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/infra -o IdentitiesOnly=yes"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then
              echo "✅ catchap-infra 갱신 — stt-worker → ${SHA}"
              exit 0
            fi
            echo "  push 거절 — 다른 저장소가 먼저 넣은 것으로 보고 다시 얹습니다 ($i/5)"
            git fetch -q origin main || { echo "::error::catchap-infra fetch 실패"; exit 1; }
            git rebase -q origin/main || {
              git rebase --abort 2>/dev/null
              echo "::error::rebase 충돌 — 손으로 봐야 합니다"
              exit 1
            }
            sleep $((i * 3))
          done
          echo "::error::5번 시도했는데 catchap-infra 에 push 가 안 됩니다"
          exit 1

      - name: 뒷정리
        if: always()
        run: shred -u ~/.ssh/infra 2>/dev/null || rm -f ~/.ssh/infra

      - name: 요약
        if: steps.gate.outputs.ready == 'true'
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          {
            echo "### 배포 이미지"
            echo ""
            echo '```'
            echo "${REGISTRY}/${IMAGE_PATH}:${SHA}"
            echo '```'
            echo ""
            echo "매니페스트: \`${MANIFEST}\` (catchap-infra)"
          } >> "$GITHUB_STEP_SUMMARY"
