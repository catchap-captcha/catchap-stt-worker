name: CI

# ★이 저장소에는 시험이 없다 — 그래서 「없는 시험을 돌리는 척」하지 않는다.
#   대신 ★GPU 없이도 확인할 수 있는 것만 실제로 확인한다.
#
#   ★확인되는 것
#     · main.py 가 문법 오류 없이 import 되나
#     · /health 가 200 을 주나
#     · 토큰이 틀리면 /transcribe 가 ★401 을 주나 (인증이 살아 있나)
#
#   ★확인되지 ★않는 것 (숨기지 않고 적어 둔다)
#     · 진짜 전사가 되는지는 ★GPU 가 있어야 안다. 여기서는 못 본다.
#       → 배포한 뒤 클러스터에서 실제 파일로 확인한다.
#
# ★faster-whisper 를 안 깐다 — 6GB 가 넘고 CUDA 를 끌고 온다.
#   main.py 가 faster_whisper 를 ★함수 안에서 import 하도록 짜여 있어서
#   HTTP 계층만 따로 시험할 수 있다. 그 설계 덕분에 이 CI 가 10초에 끝난다.

# ★언제 도는가 — ★PR 과 main 뿐이다 (2026-08-11 변경).
#   그전에는 `branches: ['**']` 이라 ★모든 브랜치의 모든 푸시에서 돌았고,
#   PR 작업 중에는 커밋 하나가 ★두 번 검사됐다 — PR 화면에
#   `CI / test (push)` 와 `CI / test (pull_request)` 가 나란히 떴다.
#   Free 플랜 + 비공개 저장소라 Actions 분(分)이 ★유료 계량 대상이다.
#
# ⚠️main 을 남기는 이유 — 브랜치 보호를 못 걸어(Free 플랜) ★main 직접 push 가
#   막히지 않는다. 그때도 검사는 돌아야 한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: HTTP 계층 의존성만 설치
        run: |
          python -m pip install --upgrade pip
          # ★requirements.txt 를 안 쓴다 — faster-whisper 는 GPU 용이라 여기서 필요 없다
          pip install fastapi==0.115.6 python-multipart==0.0.20 httpx uvicorn==0.34.0

      - name: HTTP 계층 확인
        env:
          STT_WORKER_TOKEN: ci-test-token
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import main

          c = TestClient(main.app)

          r = c.get("/health")
          assert r.status_code == 200, r.status_code
          b = r.json()
          assert b["ok"] is True and b["loaded"] is False, b
          print("  /health        200", b)

          # ★토큰이 틀리면 막혀야 한다 — 이게 뚫리면 누구나 GPU 를 쓸 수 있다
          r = c.post("/transcribe", files={"file": ("a.mp4", b"x", "video/mp4")},
                     headers={"X-Worker-Token": "wrong"})
          assert r.status_code == 401, (r.status_code, r.text[:200])
          print("  /transcribe    401 (토큰 불일치)")

          # ★헤더가 아예 없어도 막혀야 한다
          r = c.post("/transcribe", files={"file": ("a.mp4", b"x", "video/mp4")})
          assert r.status_code == 401, (r.status_code, r.text[:200])
          print("  /transcribe    401 (헤더 없음)")
          PY

      - name: ★금고 로더가 _TOKEN 보다 먼저 도는지
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ★왜 이 시험이 있나 — main.py 는 모듈을 부르는 ★그 순간 _TOKEN 을 읽어 굳힌다.
          #   로더 호출이 그 줄 뒤로 밀리면 _TOKEN 이 ★빈 값이 되고, 빈 값이면 인증을
          #   통째로 건너뛴다. ★막히는 게 아니라 ★열리기 때문에 아무도 못 알아챈다.
          #
          # ★어떻게 확인하나 — 진짜 금고를 부르지 않는다. secrets_loader 를 ★가짜로 바꿔
          #   「로더가 넣어 준 값」을 흉내 내고, main._TOKEN 이 그 값을 들고 있는지 본다.
          #   순서가 맞으면 'from-vault' 가 나오고, 뒤집히면 빈 문자열이 나온다.
          python - <<'PY'
          import os, shutil, subprocess, sys, tempfile

          d = tempfile.mkdtemp()
          shutil.copy("main.py", d)
          with open(os.path.join(d, "secrets_loader.py"), "w", encoding="utf-8") as f:
              f.write("import os\n"
                      "def load_secrets_into_env(environ=None):\n"
                      "    os.environ['STT_WORKER_TOKEN'] = 'from-vault'\n")

          env = dict(os.environ)
          env.pop("STT_WORKER_TOKEN", None)     # ★환경에는 없다 — 로더만이 넣을 수 있다
          env["PYTHONPATH"] = d

          out = subprocess.run(
              [sys.executable, "-c", "import main; print(repr(main._TOKEN))"],
              cwd=d, env=env, capture_output=True, text=True)
          got = out.stdout.strip()
          if got != repr("from-vault"):
              print("STDOUT:", out.stdout); print("STDERR:", out.stderr[-1500:])
              raise SystemExit(
                  "★로더가 _TOKEN 보다 늦게 돕니다. main.py 에서 load_secrets_into_env() 를\n"
                  "  _TOKEN = os.environ.get(...) 줄 ★앞으로 옮기십시오.\n"
                  "  받은 값: %s" % got)
          print("  _TOKEN =", got, "→ 로더가 ★먼저 돌았습니다")
          PY

      - name: ★★전사 중에도 /health 가 대답하는지 (살아있음 검사에 안 죽는지)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ★★왜 이 시험이 있나 — 2026-08-10 ★실제 장애.
          #
          #   transcribe 를 `async def` 로 두고 그 안에서 faster-whisper 의 ★블로킹 호출을
          #   했더니 ★이벤트 루프가 멈췄다. 전사하는 동안 /health 가 응답을 못 했고,
          #   쿠버네티스 살아있음 검사(30초×3=90초)가 ★전사 중인 파드를 죽였다.
          #   강의 하나를 실제로 올렸다가 exitCode 137 로 죽고 실패 메일이 나갔다.
          #
          #   ⚠️짧은 표본(16~40초)으로만 시험해서 90초를 못 넘겨 ★안 드러났다.
          #     그래서 이 시험은 ★시간이 아니라 「전사 중에 /health 가 사나」를 본다.
          python - <<'PY'
          import io, os, shutil, subprocess, sys, tempfile, threading, time, urllib.request

          d = tempfile.mkdtemp()
          shutil.copy("main.py", d)
          io.open(os.path.join(d, "secrets_loader.py"), "w", encoding="utf-8").write(
              "def load_secrets_into_env(environ=None):\n    return None\n")

          # ★faster_whisper 를 ★느린 가짜로 바꾼다 (GPU 없이 블로킹만 흉내)
          fw = os.path.join(d, "faster_whisper")
          os.makedirs(fw)
          io.open(os.path.join(fw, "__init__.py"), "w", encoding="utf-8").write(
              "import time\n"
              "class _Seg:\n"
              "    def __init__(s): s.start=0.0; s.end=1.0; s.text='ok'\n"
              "class _Info:\n"
              "    duration=1.0; language='ko'\n"
              "class WhisperModel:\n"
              "    def __init__(self, *a, **k): pass\n"
              "    def transcribe(self, path, **k):\n"
              "        time.sleep(6)          # ★블로킹 — 진짜 전사를 흉내 낸다\n"
              "        return [_Seg()], _Info()\n")

          env = dict(os.environ)
          env.update({"STT_WORKER_TOKEN": "t" * 8, "STT_DEVICE": "cpu",
                      "STT_MODEL": "tiny", "PYTHONPATH": d})
          srv = subprocess.Popen([sys.executable, "-m", "uvicorn", "main:app",
                                  "--host", "127.0.0.1", "--port", "8199"],
                                 cwd=d, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          try:
              for _ in range(60):                      # 뜰 때까지
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8199/health", timeout=1); break
                  except Exception: time.sleep(0.5)
              else:
                  raise SystemExit("  ★서버가 안 떴습니다")

              done = {}
              def do_transcribe():
                  b = "bnd"
                  body = (("--%s\r\nContent-Disposition: form-data; name=\"file\"; "
                           "filename=\"a.wav\"\r\n\r\n" % b).encode() + b"x"
                          + ("\r\n--%s--\r\n" % b).encode())
                  r = urllib.request.urlopen(urllib.request.Request(
                      "http://127.0.0.1:8199/transcribe", data=body,
                      headers={"Content-Type": "multipart/form-data; boundary=%s" % b,
                               "X-Worker-Token": "t" * 8}), timeout=60)
                  done["status"] = r.status

              th = threading.Thread(target=do_transcribe); th.start()
              time.sleep(1.5)                          # 전사가 도는 중

              ok = slow = 0
              t0 = time.time()
              while time.time() - t0 < 4:              # ★전사 도는 동안 계속 두드린다
                  s = time.time()
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8199/health", timeout=5)
                      ok += 1
                      if time.time() - s > 1: slow += 1
                  except Exception as e:
                      raise SystemExit(
                          "  ★전사 중에 /health 가 죽었습니다 (%s).\n"
                          "    → transcribe 가 이벤트 루프를 막고 있습니다.\n"
                          "    → main.py 의 `async def transcribe` 를 ★`def` 로 바꾸십시오."
                          % type(e).__name__)
                  time.sleep(0.2)
              th.join(timeout=60)
              print("  전사 중 /health 성공 %d회 (느린 응답 %d회) · 전사 결과 %s"
                    % (ok, slow, done.get("status")))
              assert done.get("status") == 200, done
              assert slow == 0, "  ★/health 가 느려졌습니다 — 루프가 눌리고 있습니다"
              print("  ★전사 중에도 /health 가 즉시 대답합니다 — 살아있음 검사에 안 죽습니다")
          finally:
              srv.terminate()
          PY

      - name: ★토큰이 비면 기동에서 죽는지
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # ★왜 이 시험이 있나 — 0810 에 ConfigMap 에서 SECRETS_BACKEND 가 빠진 채 배포돼
          #   토큰이 안 들어왔고, 빈 토큰이면 인증을 통째로 건너뛰어 ★열린 채로 돌았다.
          #   파드는 Running, /health 는 200 이라 아무 데도 안 보였다.
          #   그래서 「빈 토큰이면 죽는다」를 코드에 넣었고, 그것이 ★지켜지는지 여기서 본다.
          python - <<'PY'
          import os, subprocess, sys

          def run(env_extra, label):
              env = dict(os.environ)
              env.pop("STT_WORKER_TOKEN", None)
              env.pop("STT_ALLOW_NO_AUTH", None)
              env.update(env_extra)
              p = subprocess.run([sys.executable, "-c", "import main"],
                                 env=env, capture_output=True, text=True)
              print("  %-34s exit=%s" % (label, p.returncode))
              return p

          # ① 토큰 없음 · 허용 안 함 → ★죽어야 한다
          p = run({}, "① 토큰 없음")
          assert p.returncode != 0, "★빈 토큰인데 그냥 떴습니다 — 인증이 꺼진 채로 도는 상태입니다"
          assert "STT_WORKER_TOKEN 이 비어 있습니다" in p.stderr, p.stderr[-800:]
          print("     → 죽었고, 왜 죽었는지도 말합니다")

          # ② 토큰 없음 · ★일부러 허용 → 떠야 한다 (로컬 개발용 탈출구)
          p = run({"STT_ALLOW_NO_AUTH": "true"}, "② STT_ALLOW_NO_AUTH=true")
          assert p.returncode == 0, p.stderr[-800:]

          # ③ 토큰 있음 → 떠야 한다
          p = run({"STT_WORKER_TOKEN": "x" * 48}, "③ 토큰 있음")
          assert p.returncode == 0, p.stderr[-800:]
          PY
